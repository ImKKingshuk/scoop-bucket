name: Update Bucket

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Manifest to update
        required: true
        type: choice
        options:
          - lockknife
          - bloatwarehatao

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      manifest_sha256: ${{ steps.manifest.outputs.manifest_sha256 }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release asset
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_MANIFEST: ${{ inputs.manifest }}
        run: |
          set -euo pipefail
          MANIFEST="$INPUT_MANIFEST"

          case "$MANIFEST" in
            lockknife)
              REPO="ImKKingshuk/LockKnife"
              ;;
            bloatwarehatao)
              REPO="ImKKingshuk/BloatwareHatao"
              ;;
            *)
              echo "::error::Unknown manifest: $MANIFEST"
              exit 1
              ;;
          esac

          RELEASE_JSON="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/releases/latest")"

          TAG="$(jq -r '.tag_name' <<<"$RELEASE_JSON")"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Latest release tag is not an exact vX.Y.Z version: $TAG"
            exit 1
          fi

          VERSION="${TAG#v}"

          case "$MANIFEST" in
            lockknife)
              ASSET_NAME="lockknife-${VERSION}-cp312-abi3-win_amd64.whl"
              ;;
            bloatwarehatao)
              ASSET_NAME="bloatwarehatao-${VERSION}-x86_64-pc-windows-msvc.zip"
              ;;
          esac

          ASSET_URL="$(jq -r --arg name "$ASSET_NAME" '[.assets[] | select(.name == $name) | .browser_download_url] | if length == 1 then .[0] else empty end' <<<"$RELEASE_JSON")"

          if [ -z "$ASSET_URL" ]; then
            echo "::error::Could not uniquely resolve release asset: ${ASSET_NAME}"
            exit 1
          fi

          curl -fsSL -o /tmp/release-asset "$ASSET_URL"
          ASSET_HASH="$(sha256sum /tmp/release-asset | awk '{print $1}')"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "url=${ASSET_URL}" >> "$GITHUB_OUTPUT"
          echo "sha256=${ASSET_HASH}" >> "$GITHUB_OUTPUT"

      - name: Update manifest file
        id: manifest
        env:
          INPUT_MANIFEST: ${{ inputs.manifest }}
          RELEASE_HASH: ${{ steps.resolve.outputs.sha256 }}
          RELEASE_URL: ${{ steps.resolve.outputs.url }}
          RELEASE_VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          MANIFEST_PATH="bucket/${INPUT_MANIFEST}.json"
          TMP_FILE="$(mktemp)"

          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "::error::Manifest file does not exist: $MANIFEST_PATH"
            exit 1
          fi

          jq \
            --arg version "$RELEASE_VERSION" \
            --arg url "$RELEASE_URL" \
            --arg hash "$RELEASE_HASH" \
            '
              .version = $version
              | .architecture["64bit"].url = $url
              | .architecture["64bit"].hash = $hash
            ' "$MANIFEST_PATH" > "$TMP_FILE"

          mv "$TMP_FILE" "$MANIFEST_PATH"
          jq empty "$MANIFEST_PATH"

          if [ "$INPUT_MANIFEST" = "lockknife" ]; then
            jq -e '
              (.installer.script | type == "array" and length > 0)
              and (has("post_install") | not)
              and (.bin == "lockknife.cmd")
              and (.architecture["64bit"].url | endswith(".whl"))
            ' "$MANIFEST_PATH" > /dev/null
          fi

          echo "manifest_sha256=$(sha256sum "$MANIFEST_PATH" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Detect manifest changes
        id: diff
        env:
          INPUT_MANIFEST: ${{ inputs.manifest }}
        run: |
          MANIFEST_PATH="bucket/${INPUT_MANIFEST}.json"

          if [ -n "$(git status --porcelain=v1 --untracked-files=all -- "$MANIFEST_PATH")" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage updated manifest
        if: steps.diff.outputs.changed == 'true'
        env:
          INPUT_MANIFEST: ${{ inputs.manifest }}
        run: |
          mkdir -p dist
          cp "bucket/${INPUT_MANIFEST}.json" "dist/${INPUT_MANIFEST}.json"

      - name: Upload updated manifest
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: updated-manifest
          path: dist/${{ inputs.manifest }}.json
          if-no-files-found: error
          retention-days: 1

  validate:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download updated manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: updated-manifest
          path: bucket

      - name: Verify candidate manifest
        shell: powershell
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.prepare.outputs.manifest_sha256 }}
          INPUT_MANIFEST: ${{ inputs.manifest }}
        run: |
          $candidate = Join-Path $env:GITHUB_WORKSPACE "bucket\$env:INPUT_MANIFEST.json"
          $actual = (Get-FileHash -Path $candidate -Algorithm SHA256).Hash.ToLowerInvariant()

          if ($actual -ne $env:EXPECTED_MANIFEST_SHA256) {
            throw "Candidate manifest hash mismatch: expected $env:EXPECTED_MANIFEST_SHA256, got $actual"
          }

      - name: Install Scoop
        shell: powershell
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          $installExitCode = $LASTEXITCODE

          if ($installExitCode -ne 0) {
            throw "Scoop installer failed with exit code $installExitCode"
          }

          $scoopRoot = if ($env:SCOOP) { $env:SCOOP } else { Join-Path $env:USERPROFILE 'scoop' }
          $scoopShims = Join-Path $scoopRoot 'shims'
          $scoopCommand = Join-Path $scoopShims 'scoop.ps1'

          if (!(Test-Path $scoopCommand -PathType Leaf)) {
            throw "Scoop shim was not created at $scoopCommand"
          }

          $scoopShims | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Add candidate bucket
        shell: powershell
        run: |
          $bucketRoot = (Resolve-Path $env:GITHUB_WORKSPACE).Path
          scoop bucket add imkkingshuk $bucketRoot

          if ($LASTEXITCODE -ne 0) {
            throw "Could not add the candidate bucket"
          }

      - name: Install updated manifest
        shell: powershell
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.prepare.outputs.manifest_sha256 }}
          INPUT_MANIFEST: ${{ inputs.manifest }}
        run: |
          $ErrorActionPreference = 'Continue'
          $installOutput = @(
            scoop install "imkkingshuk/$env:INPUT_MANIFEST" 2>&1
          )
          $installExitCode = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          $installOutput | ForEach-Object { Write-Host $_ }

          if ($installExitCode -ne 0) {
            $details = (($installOutput | Select-Object -Last 10) -join ' | ')
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Scoop package installation failed::$details"
            throw "Scoop package installation failed"
          }

          $installedCommand = Get-Command $env:INPUT_MANIFEST -ErrorAction SilentlyContinue

          if ($null -eq $installedCommand) {
            Write-Output "::error title=Installed command not found::Scoop completed without exposing $env:INPUT_MANIFEST on PATH"
            throw "Installed command was not found on PATH"
          }

          $ErrorActionPreference = 'Continue'
          $versionOutput = @(
            & $installedCommand.Source --version 2>&1
          )
          $versionExitCode = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          $versionOutput | ForEach-Object { Write-Host $_ }

          if ($versionExitCode -ne 0) {
            $details = (($versionOutput | Select-Object -Last 10) -join ' | ')
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Installed package version check failed::$details"
            throw "Installed package version check failed"
          }

          $candidate = Join-Path $env:GITHUB_WORKSPACE "bucket\$env:INPUT_MANIFEST.json"
          $actual = (Get-FileHash -Path $candidate -Algorithm SHA256).Hash.ToLowerInvariant()

          if ($actual -ne $env:EXPECTED_MANIFEST_SHA256) {
            throw "Candidate manifest changed during validation"
          }

  publish:
    needs: [prepare, validate]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download updated manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: updated-manifest
          path: bucket

      - name: Verify validated manifest
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.prepare.outputs.manifest_sha256 }}
          INPUT_MANIFEST: ${{ inputs.manifest }}
        run: |
          set -euo pipefail
          ACTUAL_SHA256="$(sha256sum "bucket/${INPUT_MANIFEST}.json" | awk '{print $1}')"

          if [ "$ACTUAL_SHA256" != "$EXPECTED_MANIFEST_SHA256" ]; then
            echo "::error::Validated manifest hash mismatch"
            exit 1
          fi

      - name: Commit update
        env:
          INPUT_MANIFEST: ${{ inputs.manifest }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          git config --local user.name "${{ github.actor }}"
          git config --local user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

          git add "bucket/${INPUT_MANIFEST}.json"

          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git commit -m "bucket: update ${INPUT_MANIFEST} to v${RELEASE_VERSION}"
          git pull --rebase origin main
          git push
